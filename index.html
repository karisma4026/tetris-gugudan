<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fff6e9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#131022" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="놀이방" />
<meta name="description" content="담우와 아빠가 함께 노는 놀이방 — 만화영화, 구구단 테트리스, 그림동화책을 한 곳에서." />
<title>담우 &amp; 아빠 놀이방</title>
<style>
  :root{
    --bg:#fff6e9;
    --bg2:#ffe8cf;
    --ink:#2c2118;
    --sub:#7b6a5a;
    --card-radius:28px;
    --shadow:0 10px 30px rgba(120, 78, 30, .16), 0 2px 6px rgba(120, 78, 30, .08);
    --ring:rgba(255, 150, 70, .55);
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131022;
      --bg2:#1e1a34;
      --ink:#f6efe6;
      --sub:#a99fc2;
      --shadow:0 12px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
      --ring:rgba(140, 230, 210, .55);
    }
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
  }

  body{
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 80% at 50% -20%, var(--bg2) 0%, rgba(255,255,255,0) 62%),
      radial-gradient(90% 60% at 100% 110%, var(--bg2) 0%, rgba(255,255,255,0) 58%),
      var(--bg);
    background-attachment:fixed;
  }

  .wrap{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    justify-content:safe center;
    gap:clamp(18px, 3.6vh, 34px);
    width:100%;
    max-width:980px;
    margin:0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + clamp(24px, 6vh, 56px))
      calc(env(safe-area-inset-right, 0px) + clamp(18px, 5vw, 44px))
      calc(env(safe-area-inset-bottom, 0px) + clamp(22px, 5vh, 48px))
      calc(env(safe-area-inset-left, 0px) + clamp(18px, 5vw, 44px));
  }

  /* ── 제목 ───────────────────────────── */
  header{text-align:center}

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:.45em;
    margin:0 0 clamp(10px, 1.6vh, 16px);
    padding:.42em 1em;
    border-radius:999px;
    background:rgba(255, 255, 255, .62);
    border:1px solid rgba(150, 100, 40, .14);
    color:var(--sub);
    font-size:clamp(12px, 2.9vw, 14px);
    font-weight:700;
    letter-spacing:.02em;
    box-shadow:0 2px 8px rgba(120, 78, 30, .08);
  }

  @media (prefers-color-scheme: dark){
    .kicker{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.10); box-shadow:none}
  }

  h1{
    margin:0;
    font-size:clamp(28px, 8.2vw, 52px);
    line-height:1.18;
    font-weight:800;
    letter-spacing:-.02em;
  }

  h1 .amp{
    display:inline-block;
    color:#f08a3c;
    font-weight:800;
  }

  @media (prefers-color-scheme: dark){
    h1 .amp{color:#ffb578}
  }

  .sub{
    margin:clamp(8px, 1.4vh, 14px) 0 0;
    color:var(--sub);
    font-size:clamp(14px, 3.7vw, 18px);
    font-weight:600;
    line-height:1.5;
  }

  /* ── 카드 ───────────────────────────── */
  .cards{
    display:grid;
    grid-template-columns:1fr;
    gap:clamp(14px, 2.6vh, 22px);
  }

  @media (min-width:700px) and (min-height:420px){
    .cards{grid-template-columns:1fr 1fr}
  }

  @media (min-width:1040px){
    .cards{grid-template-columns:1fr 1fr 1fr}
  }

  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:clamp(12px, 2vh, 18px);
    min-height:clamp(152px, 24vh, 220px);
    padding:clamp(20px, 4.6vw, 30px);
    border-radius:var(--card-radius);
    color:#fff;
    text-decoration:none;
    overflow:hidden;
    box-shadow:var(--shadow);
    isolation:isolate;
    transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
    touch-action:manipulation;
  }

  .card::after{
    content:"";
    position:absolute;
    inset:-40% -20% auto auto;
    width:70%;
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.28), rgba(255,255,255,0) 68%);
    z-index:-1;
    pointer-events:none;
  }

  .card:active{transform:scale(.985); filter:brightness(.98)}
  .card:focus-visible{outline:3px solid var(--ring); outline-offset:4px}

  .card--game{
    background:linear-gradient(150deg, #1d2b6b 0%, #3b2d8f 48%, #6b2f8f 100%);
  }

  .card--story{
    background:linear-gradient(150deg, #f7a53a 0%, #f0763f 52%, #e0506b 100%);
  }

  .card--movie{
    background:linear-gradient(150deg, #241444 0%, #4c1f4f 46%, #8f2f4b 100%);
  }

  .card .top{
    display:flex;
    align-items:center;
    gap:.6em;
    flex-wrap:wrap;
  }

  .emoji{
    display:grid;
    place-items:center;
    width:clamp(46px, 11vw, 58px);
    height:clamp(46px, 11vw, 58px);
    border-radius:16px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.24);
    font-size:clamp(24px, 6vw, 30px);
    line-height:1;
    flex:0 0 auto;
  }

  .badge{
    margin-left:auto;
    padding:.34em .8em;
    border-radius:999px;
    background:rgba(255,255,255,.20);
    border:1px solid rgba(255,255,255,.26);
    font-size:clamp(11px, 2.7vw, 13px);
    font-weight:800;
    letter-spacing:.04em;
    white-space:nowrap;
  }

  .card h2{
    margin:0;
    font-size:clamp(21px, 5.4vw, 28px);
    line-height:1.25;
    font-weight:800;
    letter-spacing:-.01em;
    word-break:keep-all;
  }

  .card p{
    margin:.5em 0 0;
    font-size:clamp(13px, 3.4vw, 15.5px);
    line-height:1.5;
    color:rgba(255,255,255,.86);
    font-weight:500;
    word-break:keep-all;
  }

  .go{
    display:inline-flex;
    align-items:center;
    gap:.4em;
    align-self:flex-start;
    padding:.62em 1.15em;
    border-radius:999px;
    background:rgba(255,255,255,.94);
    color:#221a33;
    font-size:clamp(13px, 3.4vw, 15px);
    font-weight:800;
  }

  .card--story .go{color:#8a2f18}
  .card--movie .go{color:#4a1234}

  .go .arrow{
    display:inline-block;
    transition:transform .16s ease;
  }

  .card:hover .go .arrow{transform:translateX(3px)}

  /* ── 아래 안내 ───────────────────────── */
  footer{
    text-align:center;
    color:var(--sub);
    font-size:clamp(12px, 3.2vw, 14px);
    font-weight:600;
    line-height:1.6;
  }

  @media (prefers-reduced-motion:reduce){
    .card, .go .arrow{transition:none}
    .card:active{transform:none}
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="kicker">🏠 한 번에 모아보는 놀이방</p>
    <h1>담우 <span class="amp">&amp;</span> 아빠 놀이방</h1>
    <p class="sub">오늘은 뭐 하고 놀까? 아래에서 골라 눌러요.</p>
  </header>

  <nav class="cards" aria-label="놀이 목록">
    <a class="card card--game" href="./tetris.html">
      <div class="top">
        <span class="emoji" aria-hidden="true">🎮</span>
        <span class="badge">게임</span>
      </div>
      <div>
        <h2>구구단 테트리스</h2>
        <p>블록을 한 줄 지울 때마다 구구단 퀴즈가 나와요.</p>
      </div>
      <span class="go">시작하기 <span class="arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="card card--story" href="./story.html">
      <div class="top">
        <span class="emoji" aria-hidden="true">📖</span>
        <span class="badge">동화책</span>
      </div>
      <div>
        <h2>루루, 주차하자!</h2>
        <p>담우를 위한 자동차 정리 · 잠자리 그림동화.</p>
      </div>
      <span class="go">읽으러 가기 <span class="arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="card card--movie" href="./story-movie.html">
      <div class="top">
        <span class="emoji" aria-hidden="true">🎬</span>
        <span class="badge">만화영화</span>
      </div>
      <div>
        <h2>루루, 주차하자! 만화영화</h2>
        <p>그림이 움직이고, 목소리로 읽어 주는 만화영화 버전.</p>
      </div>
      <span class="go">보러 가기 <span class="arrow" aria-hidden="true">→</span></span>
    </a>
  </nav>

  <footer>
    폰은 세로로, 태블릿은 가로로 — 어느 쪽이든 손가락으로 쿡.
  </footer>
</main>
</body>
</html>
